- name: Install Java and Maven # https://docs.ansible.com/ansible/latest/collections/ansible/builtin/apt_module.html
  ansible.builtin.apt:
    name:
      - default-jdk
      - maven
    state: present
    update_cache: true

- name: Create worker user # https://docs.ansible.com/ansible/latest/collections/ansible/builtin/user_module.html
  ansible.builtin.user:
    name: worker
    system: true
    shell: /usr/sbin/nologin
    create_home: false

- name: Create worker directory # https://docs.ansible.com/ansible/latest/collections/ansible/builtin/file_module.html
  ansible.builtin.file:
    path: /opt/worker
    state: directory
    owner: worker
    group: worker
    mode: '0755'

- name: Upload worker archive # https://docs.ansible.com/ansible/latest/collections/ansible/builtin/unarchive_module.html
  ansible.builtin.unarchive:
    src: worker.tar
    dest: /opt/worker
    owner: worker
    group: worker

- name: Build worker with Maven # https://docs.ansible.com/ansible/latest/collections/ansible/builtin/command_module.html
  ansible.builtin.command:
    cmd: mvn package -DskipTests
    chdir: /opt/worker
  become_user: worker
  args:
    creates: /opt/worker/target/worker.jar

- name: Create worker env directory # https://docs.ansible.com/ansible/latest/collections/ansible/builtin/file_module.html
  ansible.builtin.file:
    path: /etc/worker
    state: directory
    owner: worker
    group: worker
    mode: '0750'

- name: Deploy worker environment file # https://docs.ansible.com/ansible/latest/collections/ansible/builtin/template_module.html
  ansible.builtin.template:
    src: worker.env.j2
    dest: /etc/worker/worker.env
    owner: worker
    group: worker
    mode: '0640'
  notify: Restart worker