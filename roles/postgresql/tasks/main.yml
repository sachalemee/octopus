- name: install postgresql package # https://docs.ansible.com/ansible/latest/collections/ansible/builtin/apt_module.html
  ansible.builtin.apt:
    name:
      - postgresql-16
      - postgresql-client-16
      - python3-psycopg
    state: present
    update_cache: true

- name: enable and start postgresql service # https://docs.ansible.com/ansible/latest/collections/ansible/builtin/service_module.html
  ansible.builtin.apt:
    name: postgresql
    state: postgresql
    enabled: true

- name: deploy pg_hba.conf # https://docs.ansible.com/ansible/latest/collections/ansible/builtin/copy_module.html
  ansible.builtin.copy:
    src: pg_hba.conf
    dest: /etc/postgresql/16/main/pg_hba.conf
    owner: postgres
    group: postgres
    mode: '0640'
  notify: Restart PostgreSQL

- name: create postgresql user paul # https://docs.ansible.com/ansible/latest/collections/community/postgresql/postgresql_user_module.html
  community.postgresql.postgresql_user:
    name: "{{ postgresql_user }}"
    password: "{{ postgresql_password }}"
    role_attr_flags: NOSUPERUSER,NOCREATEDB,NOCREATEROLE
    state: present
  become_user: postgres

- name: create postgresql database paul # https://docs.ansible.com/ansible/latest/collections/community/postgresql/postgresql_db_module.html
  community.postgresql.postgresql_db:
    name: "{{ postgresql_db }}"
    owner: "{{ postgresql_user }}"
    state: present
  become_user: postgres

- name: apply schema to paul database # https://docs.ansible.com/ansible/latest/collections/community/postgresql/postgresql_script_module.html
  community.postgresql.postgresql_script:
    db: "{{ postgresql_db }}"
    path: /tmp/schema.sql
  become_user: postgres

- name: upload schema.sql to remote # https://docs.ansible.com/ansible/latest/collections/ansible/builtin/copy_module.html
  ansible.builtin.copy:
    src: schema.sql
    dest: "/tmp/schema.sql"
    mode: '0644'
