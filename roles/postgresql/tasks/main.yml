- name: ensure pgdg keyring directory exists # debian 13 ships postgresql-17 by default, postgresql-16 needs the official pgdg repo | https://docs.ansible.com/projects/ansible/latest/collections/ansible/builtin/file_module.html
  ansible.builtin.file:
    path: /usr/share/postgresql-common/pgdg
    state: directory
    mode: '0755'

- name: download postgresql apt signing key # https://docs.ansible.com/ansible/latest/collections/ansible/builtin/get_url_module.html
  ansible.builtin.get_url:
    url: https://www.postgresql.org/media/keys/ACCC4CF8.asc
    dest: /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
    mode: '0644'

- name: add postgresql apt repository # https://docs.ansible.com/ansible/latest/collections/ansible/builtin/deb822_repository_module.html
  ansible.builtin.deb822_repository:
    name: pgdg
    types: deb
    uris: https://apt.postgresql.org/pub/repos/apt
    suites: "{{ ansible_distribution_release }}-pgdg"
    components: main
    signed_by: /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc

- name: install postgresql package # https://docs.ansible.com/ansible/latest/collections/ansible/builtin/apt_module.html
  ansible.builtin.apt:
    name:
      - postgresql-16
      - postgresql-client-16
      - python3-psycopg
    state: present
    update_cache: true

- name: enable and start postgresql service # postgresql.service is a oneshot wrapper, the real cluster daemon is postgresql@16-main
  ansible.builtin.service:
    name: postgresql@16-main
    state: started
    enabled: true

- name: configure postgresql listen_addresses # https://docs.ansible.com/ansible/latest/collections/ansible/builtin/lineinfile_module.html
  ansible.builtin.lineinfile:
    path: /etc/postgresql/16/main/postgresql.conf
    regexp: "^#?listen_addresses"
    line: "listen_addresses = '*'"
  notify: restart postgresql

- name: deploy pg_hba.conf # https://docs.ansible.com/ansible/latest/collections/ansible/builtin/copy_module.html
  ansible.builtin.copy:
    src: pg_hba.conf
    dest: /etc/postgresql/16/main/pg_hba.conf
    owner: postgres
    group: postgres
    mode: '0640'
  notify: restart postgresql

- name: create postgresql user paul # https://docs.ansible.com/ansible/latest/collections/community/postgresql/postgresql_user_module.html
  community.postgresql.postgresql_user:
    name: "{{ postgresql_user }}"
    password: "{{ postgresql_password }}"
    role_attr_flags: NOSUPERUSER,NOCREATEDB,NOCREATEROLE
    state: present
  become_user: postgres

- name: create postgresql database paul # https://docs.ansible.com/ansible/latest/collections/community/postgresql/postgresql_db_module.html
  community.postgresql.postgresql_db:
    name: "{{ postgresql_db }}"
    owner: "{{ postgresql_user }}"
    state: present
  become_user: postgres

- name: create votes table # https://docs.ansible.com/ansible/latest/collections/community/postgresql/postgresql_table_module.html
  community.postgresql.postgresql_table:
    db: "{{ postgresql_db }}"
    name: votes
    owner: "{{ postgresql_user }}"
    columns:
      - id VARCHAR(255) NOT NULL UNIQUE
      - vote VARCHAR(255) NOT NULL
    state: present
  become_user: postgres
