- name: Install Node.js # https://docs.ansible.com/ansible/latest/collections/ansible/builtin/apt_module.html
  ansible.builtin.apt:
    name:
      - nodejs
      - npm
    state: present
    update_cache: true

- name: Create result user # https://docs.ansible.com/ansible/latest/collections/ansible/builtin/user_module.html
  ansible.builtin.user:
    name: result
    system: true
    shell: /usr/sbin/nologin
    create_home: false

- name: Create result directory # https://docs.ansible.com/ansible/latest/collections/ansible/builtin/file_module.html
  ansible.builtin.file:
    path: /opt/result
    state: directory
    owner: result
    group: result
    mode: '0755'

- name: Upload result archive # https://docs.ansible.com/ansible/latest/collections/ansible/builtin/unarchive_module.html
  ansible.builtin.unarchive:
    src: result.tar
    dest: /opt/result
    owner: result
    group: result

- name: Install result dependencies # https://docs.ansible.com/ansible/latest/collections/community/general/npm_module.html
  community.general.npm:
    path: /opt/result
    state: present

- name: Create result env directory # https://docs.ansible.com/ansible/latest/collections/ansible/builtin/file_module.html
  ansible.builtin.file:
    path: /etc/result
    state: directory
    owner: result
    group: result
    mode: '0750'

- name: Deploy result environment file # https://docs.ansible.com/ansible/latest/collections/ansible/builtin/template_module.html
  ansible.builtin.template:
    src: result.env.j2
    dest: /etc/result/result.env
    owner: result
    group: result
    mode: '0640'
  notify: Restart result