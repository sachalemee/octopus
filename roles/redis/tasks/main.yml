- name: install redis # https://docs.ansible.com/ansible/latest/collections/ansible/builtin/apt_module.html
  ansible.builtin.apt:
    name: redis-server
    state: present
    update_cache: true

- name: deploy redis configuration # https://docs.ansible.com/projects/ansible/latest/collections/ansible/builtin/copy_module.html
  ansible.builtin.copy:
    src: redis.conf
    dest: /etc/redis/redis.conf
    owner: redis
    group: redis
    mode: '0644'
  notify: Restart Redis

- name: enable and start redis service # https://docs.ansible.com/projects/ansible/latest/collections/ansible/builtin/service_module.html
  ansible.builtin.service:
    name: redis-server
    state: started
    enabled: true
